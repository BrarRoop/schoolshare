name: Azure App Service Deployment

on:
  push:
    branches:
      - main  # Adjust this based on your branch configuration

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Use your preferred Node.js version

      - name: Install dependencies
        run: npm install  # Or yarn, if using Yarn

      - name: Build application
        run: npm run build  # Or the appropriate build command

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'school-share.azurewebsites.net'  # Your Azure Web App name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .  # Path to your build output directory or artifact
